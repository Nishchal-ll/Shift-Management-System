root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/main ."
  bin = "./tmp/main"
  delay = 500
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".git", "database"]
  include_ext = ["go", "tpl", "tmpl", "html", "gohtml", "css", "js"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true
  log = "air.log"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
