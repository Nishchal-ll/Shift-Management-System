{{define "modal_edit"}}
<div id="editModal" class="modal-backdrop">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; border-bottom:1px solid var(--border-light); padding-bottom:0.75rem;">
            <h3 style="margin:0; font-size:1.2rem; font-weight:700; color:#0f172a;">Edit Shift Allocation</h3>
            <button type="button" onclick="document.getElementById('editModal').style.display='none'" class="alert-close" style="font-size:1.5rem; color:#64748b;">&times;</button>
        </div>

        <form action="/admin/edit-allocation" method="POST" class="form-grid">
            <input type="hidden" id="modal-id" name="id">
            
            <div class="form-group">
                <label for="modal-employee">Employee</label>
                <input type="text" id="modal-employee" name="employee_name" readonly style="background:#f1f5f9; cursor:not-allowed;">
            </div>

            <div class="form-group">
                <label for="modal-shift">Shift Type</label>
                <select id="modal-shift" name="shift_name">
                    {{range .ShiftTypes}}
                        <option value="{{.Name}}">{{.Name}}</option>
                    {{end}}
                </select>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                <div class="form-group">
                    <label for="modal-start">Start Date</label>
                    <input type="date" id="modal-start" name="start_date" required>
                </div>
                <div class="form-group">
                    <label for="modal-end">End Date</label>
                    <input type="date" id="modal-end" name="end_date" required>
                </div>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1rem;">
                <button type="button" onclick="document.getElementById('editModal').style.display='none'" class="btn-demo-chip" style="background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; padding:0.6rem 1.2rem;">
                    Cancel
                </button>
                <button type="submit" class="btn-primary" style="padding:0.6rem 1.25rem;">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
